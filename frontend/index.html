<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtaCoach Pitch Viewer</title>
</head>
<body>
    <h1>UtaCoach 音高分析</h1>

    <input type="file" id="audioFile" accept="audio/*">
    <button id="uploadBtn">分析音高</button>

    <p id="status"></p>

    <h2>麥克風錄音</h2>

    <button id="startRecordBtn">開始錄音</button>
    <button id="stopRecordBtn" disabled>停止錄音</button>
    <button id="analyzeRecordingBtn" disabled>分析錄音</button>

    <p id="recordStatus">尚未錄音</p>

    <audio id="recordedAudio" controls></audio>

    <div id="pitchSummary">
        <p>主要音高：<strong id="mainNote">--</strong></p>
        <p>最低音：<strong id="lowestNote">--</strong></p>
        <p>最高音：<strong id="highestNote">--</strong></p>
    </div>

    <h2>音高穩定度</h2>
    <div id="stabilitySummary">
        <p>平均穩定度：<strong id="avgStability">--</strong></p>
        <p>最不穩定音符：<strong id="leastStableNote">--</strong></p>
    </div>
    
    <canvas
        id="pitchChart"
        width="1000"
        height="500"
        style="border: 1px solid #ccc;">
    </canvas>
    <h2>音符區段</h2>

    <canvas
        id="noteSegmentsChart"
        width="1000"
        height="500"
        style="border: 1px solid #ccc;">
    </canvas>

    <script src="app.js"></script>
</body>
</html>
